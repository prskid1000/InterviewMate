stt:
  language: en
  providers:
  - name: Gemini
    api_type: gemini
    model: gemini-2.5-flash-lite
    enabled: true
    base_url: ''
    api_key_env: GEMINI_API_KEY
  - name: Groq Whisper
    api_type: openai
    model: whisper-large-v3-turbo
    enabled: false
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
overlay:
  enabled: true
  exclude_from_capture: false
  opacity: 0.9
hotkeys:
  record_toggle: ctrl+space
  open_config: ctrl+alt+c
  toggle_answer: ctrl+alt+h
  toggle_hud: ctrl+alt+b
  quit: ctrl+alt+q
audio:
  capture_mic: true
  capture_system_audio: true
  max_record_seconds: 180
  auto_silence: false
  silence_seconds: 1.2
  speech_threshold: 0.02
llm:
  providers:
  - name: Gemini
    api_type: openai
    model: gemini-2.5-flash-lite
    enabled: true
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  - name: Groq
    api_type: openai
    model: llama-3.3-70b-versatile
    enabled: false
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  history_exchanges: 12
  max_tokens: 900
  temperature: 0.4
  disable_thinking: true
  thinking_tokens: 0
profile: Interview
persona: ''
server:
  host: 127.0.0.1
  port: 8765
